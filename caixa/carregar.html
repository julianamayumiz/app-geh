<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
  <title>Carregar Saldo — Caixa</title>
  <script>(function(){try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</head>
<body>
  <header class="header">
    <a href="index.html" class="back" aria-label="Voltar"><span data-icon="arrow-left" data-size="24"></span></a>
    <h1 id="titulo" style="display:inline-flex;align-items:center;gap:0.5rem;"><span data-icon="wallet" data-size="22"></span> Carregar Saldo</h1>
  </header>

  <main>
    <div class="cliente-info">
      <div class="nome" id="cliente-nome">Carregando...</div>
      <div class="saldo-label">Saldo atual</div>
      <div class="saldo" id="cliente-saldo">R$ 0,00</div>
    </div>

    <div id="alerta" class="alert hidden"></div>

    <div id="form-recarga" class="card">
      <div class="form-group">
        <label>Valor a carregar (R$)</label>
        <input type="number" id="valor" step="0.50" min="0" placeholder="Ex: 20,00" inputmode="decimal">
      </div>
      <div class="form-group">
        <label>Forma de pagamento</label>
        <select id="forma-pagto">
          <option value="dinheiro">Dinheiro</option>
          <option value="pix">Pix</option>
          <option value="cartao">Cartão</option>
        </select>
      </div>
      <button id="btn-carregar" class="btn btn-success"><span data-icon="plus" data-size="18"></span> Adicionar saldo</button>
    </div>

    <div id="historico" class="hidden">
      <h3 style="color:var(--azul);margin:1rem 0 0.75rem;display:inline-flex;align-items:center;gap:0.5rem;"><span data-icon="clock" data-size="20"></span> Histórico</h3>
      <div id="lista-hist" class="hist-list"></div>
    </div>
  </main>
  <script type="module" src="../js/icons.js"></script>

  <script type="module">
    import {
      db, doc, getDoc, getDocs, collection, query, where, orderBy,
      addDoc, serverTimestamp, runTransaction
    } from "../js/firebase-config.js";
    import { icon, renderIcons } from "../js/icons.js";
    import { requireAuth } from "../js/auth-guard.js";

    // Aceita admin também (homeFor não redireciona, e admin pode atender o caixa).
    const { perfil } = await requireAuth({ papel: 'caixa' });

    const params = new URLSearchParams(window.location.search);
    const clienteId = params.get('cliente');
    const somenteConsulta = params.get('somente') === '1';
    if (!clienteId) window.location.href = 'index.html';

    if (somenteConsulta) {
      document.getElementById('titulo').innerHTML = `${icon('eye', { size: 22 })} Saldo do cliente`;
      document.getElementById('form-recarga').classList.add('hidden');
    }

    const fmtBRL = (v) => `R$ ${Number(v || 0).toFixed(2).replace('.', ',')}`;

    async function carregarHistorico() {
      const [movSnap, vendasSnap, transfOrigemSnap, transfDestinoSnap] = await Promise.all([
        getDocs(query(collection(db, 'movimentacoes_saldo'), where('clienteId', '==', clienteId), orderBy('criadoEm', 'desc'))),
        getDocs(query(collection(db, 'vendas'), where('clienteId', '==', clienteId), orderBy('criadoEm', 'desc'))),
        getDocs(query(collection(db, 'transferencias_saldo'), where('origemId', '==', clienteId), orderBy('criadoEm', 'desc'))),
        getDocs(query(collection(db, 'transferencias_saldo'), where('destinoId', '==', clienteId), orderBy('criadoEm', 'desc')))
      ]);

      const movs = [];
      movSnap.forEach(d => {
        const m = d.data();
        movs.push({
          quando: m.criadoEm?.toDate?.() || new Date(0),
          tipo: 'recarga',
          detalhe: `Via ${m.forma || '—'}`,
          valor: m.valor,
          positivo: true
        });
      });
      vendasSnap.forEach(d => {
        const v = d.data();
        const itens = (v.itens || []).map(i => `${i.qtd}× ${i.nome}`).join(', ');
        movs.push({
          quando: v.criadoEm?.toDate?.() || new Date(0),
          tipo: 'venda',
          detalhe: itens || '—',
          valor: v.total,
          positivo: false
        });
      });
      transfOrigemSnap.forEach(d => {
        const t = d.data();
        const para = t.destinoNome ? `${t.destinoId} (${t.destinoNome})` : t.destinoId;
        movs.push({
          quando: t.criadoEm?.toDate?.() || new Date(0),
          tipo: 'transfer ↗',
          detalhe: `Enviado para ${para}`,
          valor: t.valor,
          positivo: false
        });
      });
      transfDestinoSnap.forEach(d => {
        const t = d.data();
        const de = t.origemNome ? `${t.origemId} (${t.origemNome})` : t.origemId;
        movs.push({
          quando: t.criadoEm?.toDate?.() || new Date(0),
          tipo: 'transfer ↙',
          detalhe: `Recebido de ${de}`,
          valor: t.valor,
          positivo: true
        });
      });
      movs.sort((a, b) => b.quando - a.quando);

      const lista = document.getElementById('lista-hist');
      if (movs.length === 0) {
        lista.innerHTML = `<div class="empty-state">${icon('inbox', { size: 32 })}<p>Sem movimentações.</p></div>`;
      } else {
        lista.innerHTML = movs.map(m => {
          const cor = m.positivo ? 'var(--verde)' : 'var(--vermelho)';
          const sinal = m.positivo ? '+' : '-';
          const dt = m.quando.toLocaleDateString('pt-BR');
          const hr = m.quando.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          return `<div class="hist-item">
            <div class="hist-row">
              <span class="hist-badge" style="background:${cor};">${m.tipo}</span>
              <span class="hist-quando">${dt} · ${hr}</span>
              <span class="hist-valor" style="color:${cor};">${sinal} ${fmtBRL(m.valor)}</span>
            </div>
            <div class="hist-detalhe">${m.detalhe}</div>
          </div>`;
        }).join('');
      }
      document.getElementById('historico').classList.remove('hidden');
      renderIcons();
    }

    let eventoAtivo = null;
    getDoc(doc(db, 'config', 'eventoAtivo')).then(s => { if (s.exists()) eventoAtivo = s.data(); });

    const $ = (id) => document.getElementById(id);
    const alerta = $('alerta');
    const vibrar = (padrao) => { try { navigator.vibrate?.(padrao); } catch(_) {} };

    function mostrarAlerta(msg, tipo = 'info') {
      alerta.textContent = msg;
      alerta.className = `alert alert-${tipo}`;
      alerta.classList.remove('hidden');
    }

    async function carregarCliente() {
      const ref = doc(db, 'clientes', clienteId);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        $('cliente-nome').innerHTML = `<span style="display:inline-flex;align-items:center;gap:0.4rem;">${icon('x-circle', { size: 20 })} Cliente não cadastrado</span>`;
        mostrarAlerta(`Cliente ${clienteId} não encontrado. Cadastre no admin antes.`, 'danger');
        return null;
      }
      const dados = { id: clienteId, ...snap.data() };
      $('cliente-nome').textContent = clienteId;
      $('cliente-saldo').textContent = fmtBRL(dados.saldo);
      if (somenteConsulta) carregarHistorico();
      return dados;
    }

    $('btn-carregar')?.addEventListener('click', async () => {
      const valor = parseFloat($('valor').value);
      if (!valor || valor <= 0) return mostrarAlerta('Digite um valor maior que zero', 'warning');

      const forma = $('forma-pagto').value;
      $('btn-carregar').disabled = true;
      $('btn-carregar').innerHTML = '<div class="loader"></div> Processando...';

      // Aviso de "conexão lenta" se o servidor demorar pra confirmar
      const timerLento = setTimeout(() => {
        $('btn-carregar').innerHTML = '<div class="loader"></div> Conexão lenta — aguardando servidor…';
      }, 5000);

      let movIdGerado = null;
      let saldoFinal = null;

      try {
        await runTransaction(db, async (tx) => {
          const ref = doc(db, 'clientes', clienteId);
          const snap = await tx.get(ref);
          if (!snap.exists()) throw new Error('Cliente não encontrado');
          const saldo = snap.data().saldo || 0;
          saldoFinal = saldo + valor;
          tx.update(ref, { saldo: saldoFinal });

          const movRef = doc(collection(db, 'movimentacoes_saldo'));
          movIdGerado = movRef.id;
          tx.set(movRef, {
            clienteId,
            tipo: 'recarga',
            valor,
            forma,
            eventoId: eventoAtivo?.id || null,
            eventoNome: eventoAtivo?.nome || null,
            // Auditoria — quem registrou a recarga
            caixaId: perfil.uid,
            caixaEmail: perfil.email || null,
            caixaNome: perfil.nome || null,
            criadoEm: serverTimestamp()
          });
        });

        clearTimeout(timerLento);
        vibrar([40, 60, 40, 60, 80]);
        $('cliente-saldo').textContent = fmtBRL(saldoFinal);
        const idCurto = (movIdGerado || '').slice(-6).toUpperCase();
        alerta.innerHTML = `<span style="display:inline-flex;align-items:center;gap:0.4rem;">${icon('check-circle', { size: 18 })} Recarga #${idCurto} — +${fmtBRL(valor)} · saldo agora ${fmtBRL(saldoFinal)}</span>`;
        alerta.className = 'alert alert-success';
        alerta.classList.remove('hidden');
        setTimeout(() => window.location.href = 'index.html', 1500);
      } catch (err) {
        clearTimeout(timerLento);
        vibrar([100, 50, 100]);

        // Mensagens específicas — espelha o padrão do vender.html
        const eContencao = err.code === 'failed-precondition'
                       || err.code === 'aborted'
                       || /stored version/i.test(err.message || '');
        let mensagem;
        if (err.message === 'Cliente não encontrado') {
          mensagem = 'Cliente não encontrado.';
        } else if (eContencao) {
          mensagem = 'Conflito com outra operação simultânea. A recarga NÃO foi registrada — clique de novo.';
        } else {
          mensagem = `Erro: ${err.message}. Tente de novo.`;
        }
        mostrarAlerta(mensagem, 'danger');
        $('btn-carregar').disabled = false;
        $('btn-carregar').innerHTML = `${icon('plus', { size: 18 })} Adicionar saldo`;
      }
    });

    carregarCliente();
  </script>
</body>
</html>

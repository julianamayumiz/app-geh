<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transferir saldo — App GEH</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="/js/sw-register.js"></script>
</head>
<body>
  <main style="padding:2rem 1rem; text-align:center;">
    <p>Abrindo a transferência de saldo…</p>
    <p><a id="ir" href="pdv.html#/scan?acao=transferir">Toque aqui se não abrir sozinho</a></p>
  </main>
  <script type="module">
    // Pagina antiga: a transferencia agora e uma tela do PDV (camera persistente).
    // Mantida so pra links/atalhos antigos continuarem funcionando.
    import { requireAuth } from '../js/auth-guard.js';
    const { perfil } = await requireAuth({ papel: ['caixa', 'operador'] });
    const destino = perfil.papel === 'operador' ? '../operador/pdv.html' : 'pdv.html';
    const url = `${destino}#/scan?acao=transferir`;
    document.getElementById('ir').href = url;
    location.replace(url);
  </script>
</body>
</html>

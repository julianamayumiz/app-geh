<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
  <title>Scanner — App GEH</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="../assets/logo.png">
  <link rel="manifest" href="../manifest.json">
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <header class="header">
    <a href="index.html" class="back" aria-label="Voltar"><span data-icon="arrow-left" data-size="24"></span></a>
    <h1 id="titulo-acao">Escanear QR</h1>
  </header>

  <main>
    <div class="card">
      <p class="text-center text-muted mb-2">Aponte a câmera para o QR code do cliente</p>
      <div id="scanner-container">
        <div id="reader" style="width: 100%;"></div>
      </div>

      <div id="alerta" class="alert alert-info mt-2 hidden"></div>

      <div class="mt-2">
        <button id="btn-manual" class="btn btn-secondary">
          <span data-icon="keyboard" data-size="18"></span>
          Digitar ID manualmente
        </button>
      </div>

      <div id="manual-form" class="hidden mt-2">
        <div class="form-group">
          <label>ID do cliente</label>
          <input type="text" id="id-manual" placeholder="Ex: GEH001" autocomplete="off">
        </div>
        <button class="btn btn-primary" onclick="usarIdManual()">Continuar</button>
      </div>
    </div>
  </main>
  <script type="module" src="../js/icons.js"></script>

  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const acao = params.get('acao') || 'consultar';

    const { icon } = await import('../js/icons.js');
    const titulos = {
      vender:    { ic: 'shopping-cart', txt: 'Vender para cliente' },
      carregar:  { ic: 'wallet', txt: 'Carregar saldo' },
      consultar: { ic: 'eye', txt: 'Consultar saldo' }
    };
    const t = titulos[acao];
    const h1 = document.getElementById('titulo-acao');
    h1.innerHTML = `${icon(t.ic, { size: 20 })} ${t.txt}`;
    h1.style.display = 'inline-flex';
    h1.style.alignItems = 'center';
    h1.style.gap = '0.5rem';

    const alerta = document.getElementById('alerta');

    function irPara(clienteId) {
      if (acao === 'vender') {
        window.location.href = `vender.html?cliente=${encodeURIComponent(clienteId)}`;
      } else if (acao === 'carregar') {
        window.location.href = `carregar.html?cliente=${encodeURIComponent(clienteId)}`;
      } else {
        window.location.href = `carregar.html?cliente=${encodeURIComponent(clienteId)}&somente=1`;
      }
    }

    // Scanner
    const scanner = new Html5Qrcode("reader");
    scanner.start(
      { facingMode: "environment" },
      {
        fps: 30,
        qrbox: (w, h) => ({ width: Math.min(w, h) * 0.8, height: Math.min(w, h) * 0.8 }),
        aspectRatio: 1.0,
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      },
      (decoded) => {
        scanner.stop();
        irPara(decoded.trim());
      },
      () => { /* ignorar erros de frame */ }
    ).catch(err => {
      alerta.textContent = "Não consegui acessar a câmera. Use o botão abaixo para digitar o ID.";
      alerta.className = "alert alert-warning mt-2";
    });

    // Entrada manual
    document.getElementById('btn-manual').onclick = () => {
      document.getElementById('manual-form').classList.toggle('hidden');
    };
    window.usarIdManual = () => {
      const id = document.getElementById('id-manual').value.trim();
      if (!id) return alert('Digite um ID');
      scanner.stop().catch(()=>{});
      irPara(id);
    };
  </script>
</body>
</html>

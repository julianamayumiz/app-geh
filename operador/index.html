<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E3A8A">
  <title>Operador — App GEH</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</head>
<body>
  <header class="header">
    <a href="../index.html" class="back" aria-label="Voltar"><span data-icon="arrow-left" data-size="24"></span></a>
    <img src="../assets/logo.png" alt="GEH" onerror="this.style.display='none'">
    <h1>Operador de Venda</h1>
  </header>

  <main>
    <div class="card" id="evento-box">
      <p class="text-muted text-center" id="evento-label">Verificando evento ativo...</p>
    </div>

    <div class="grid-acoes">
      <a href="scanner.html?acao=vender" class="btn btn-primary btn-lg">
        <span data-icon="shopping-cart" data-size="32"></span>
        Vender
      </a>
      <a href="scanner.html?acao=carregar" class="btn btn-accent btn-lg">
        <span data-icon="wallet" data-size="32"></span>
        Carregar Saldo
      </a>
      <a href="scanner.html?acao=consultar" class="btn btn-secondary btn-lg">
        <span data-icon="eye" data-size="32"></span>
        Consultar Saldo
      </a>
    </div>
  </main>
  <script type="module" src="../js/icons.js"></script>
  <script type="module">
    import { db, doc, getDoc } from "../js/firebase-config.js";
    const snap = await getDoc(doc(db, 'config', 'eventoAtivo'));
    const label = document.getElementById('evento-label');
    const box = document.getElementById('evento-box');
    if (snap.exists() && snap.data().id) {
      label.innerHTML = `<strong style="color:var(--verde);display:inline-flex;align-items:center;gap:0.4rem;"><span style="width:8px;height:8px;background:var(--verde);border-radius:50%;display:inline-block;"></span>${snap.data().nome}</strong><br><span style="font-size:0.8rem;color:var(--cinza);">Evento ativo</span>`;
    } else {
      const { icon } = await import('../js/icons.js');
      label.innerHTML = `<span style="color:var(--vermelho);display:inline-flex;align-items:center;gap:0.4rem;justify-content:center;">${icon('alert-triangle', { size: 18 })} Nenhum evento ativo. Avise a diretoria.</span>`;
      box.style.borderLeft = '4px solid var(--vermelho)';
    }
  </script>
</body>
</html>

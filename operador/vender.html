<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
  <title>Vender — App GEH</title>
  <script>(function(){try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
  <style>
    .prod-card {
      position: relative;
      background: var(--branco);
      border-radius: var(--radius-sm);
      padding: 0.875rem;
      box-shadow: var(--sombra);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      border: 2px solid transparent;
      transition: border-color 0.15s, transform 0.15s;
    }
    .prod-card.no-carrinho {
      border-color: var(--azul);
      transform: translateY(-1px);
    }
    .prod-card.sem-estoque { opacity: 0.45; pointer-events: none; }

    /* Indicador de favorito no card */
    .prod-card .fav-star {
      position: absolute;
      top: 6px;
      left: 6px;
      color: var(--amarelo);
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15));
    }

    /* Caixa de busca */
    .busca-wrapper {
      position: relative;
      margin-bottom: 0.75rem;
    }
    .busca-wrapper input {
      width: 100%;
      padding: 0.7rem 0.75rem 0.7rem 2.4rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--cinza-claro);
      background: var(--branco);
      color: inherit;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .busca-wrapper .busca-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--cinza);
      pointer-events: none;
      display: inline-flex;
    }
    .busca-wrapper .busca-clear {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--cinza);
      cursor: pointer;
      padding: 0.25rem;
      display: none;
    }
    .busca-wrapper input:not(:placeholder-shown) ~ .busca-clear { display: inline-flex; }

    /* Filtro de categorias — chips horizontais com scroll */
    .cat-bar {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding: 0.25rem 0.25rem 0.6rem;
      margin: -0.25rem -0.25rem 0.25rem;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-chip {
      flex: 0 0 auto;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--cinza-claro);
      background: var(--branco);
      color: var(--cinza-escuro);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .cat-chip.ativo {
      background: var(--azul);
      color: white;
      border-color: var(--azul);
    }

    .secao-titulo {
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--cinza);
      margin: 0.5rem 0.25rem 0.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .secao-titulo .icon { color: var(--amarelo); }

    /* Badge de qtd no canto — visível só quando o item está no carrinho */
    .qtd-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      min-width: 28px;
      height: 28px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--azul);
      color: white;
      font-weight: 700;
      font-size: 0.85rem;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px -2px rgba(30,58,138,0.5);
      animation: geh-pop 200ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .prod-card.no-carrinho .qtd-badge { display: inline-flex; }
    @keyframes geh-pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .prod-nome { font-weight: 600; font-size: 0.95rem; }
    .prod-preco { font-weight: 700; font-size: 1.05rem; color: var(--verde); }
    .prod-preco.promo { color: var(--vermelho); }
    .prod-preco-old { font-size: 0.78rem; color: var(--cinza); text-decoration: line-through; }
    .prod-estoque { font-size: 0.75rem; color: var(--cinza); }

    .prod-controle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .btn-qtd {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: transform 0.1s;
      padding: 0;
    }
    .btn-qtd .icon { display: block; }
    .btn-qtd:active { transform: scale(0.9); }
    .btn-qtd:hover { filter: brightness(0.94); }
    .btn-menos { background: var(--cinza-claro); color: var(--cinza-escuro); }
    .btn-mais  { background: var(--azul); color: white; }
    .qtd-display {
      font-weight: 700;
      font-size: 1.1rem;
      min-width: 28px;
      text-align: center;
      color: var(--azul);
    }
    .btn-adicionar {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.5rem;
      background: var(--azul);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    /* Barra POS fixa — substitui o FAB pill.
       Sempre visível quando há itens no carrinho, com total em destaque
       e CTA de "Ver carrinho" estilo iFood/POS. */
    .cart-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
      background: var(--branco);
      border-top: 1px solid rgba(15,29,77,0.08);
      box-shadow: 0 -10px 30px -12px rgba(15,29,77,0.25);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .cart-bar.aberta { transform: translateY(0); }
    :root[data-theme="dark"] .cart-bar { border-top-color: rgba(255,255,255,0.06); }

    .cart-bar .resumo {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      flex: 1;
      min-width: 0;
    }
    .cart-bar .resumo-label {
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--cinza);
    }
    .cart-bar .resumo-total {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--azul);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .cart-bar .resumo-qtd {
      font-size: 0.78rem;
      color: var(--cinza);
      margin-top: 0.1rem;
    }
    .cart-bar .btn-ver {
      background: linear-gradient(135deg, var(--azul) 0%, var(--azul-escuro) 100%);
      color: white;
      border: none;
      padding: 0.85rem 1.25rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.005em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 8px 20px -8px rgba(30,58,138,0.55);
      transition: transform 0.1s;
      white-space: nowrap;
    }
    .cart-bar .btn-ver:active { transform: scale(0.97); }
    .cart-bar .btn-ver .badge {
      background: var(--amarelo);
      color: #0F1D4D;
      border-radius: 999px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      font-size: 0.78rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Modal do carrinho */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: flex-end;
    }
    .modal-overlay.aberto { display: flex; }
    .modal-box {
      background: var(--branco);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 1.25rem 1rem;
    }
    .modal-titulo {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--azul);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--cinza-claro);
      gap: 0.5rem;
    }
    .modal-item-nome { flex: 1; font-size: 0.95rem; }
    .modal-item-ctrl {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .modal-total {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1.2rem;
      padding: 0.875rem 0;
      color: var(--azul);
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="index.html" class="back" aria-label="Voltar"><span data-icon="arrow-left" data-size="24"></span></a>
    <h1 style="display:inline-flex;align-items:center;gap:0.5rem;"><span data-icon="shopping-cart" data-size="22"></span> Venda</h1>
  </header>

  <main style="padding-bottom: 6rem;">
    <div class="cliente-info">
      <div class="nome" id="cliente-nome"><span class="skel skel-on-dark skel-title" style="width:60%"></span></div>
      <div class="saldo-label">Saldo disponível</div>
      <div class="saldo" id="cliente-saldo"><span class="skel skel-on-dark skel-num" style="width:140px;height:1.8rem"></span></div>
    </div>

    <div id="alerta" class="alert hidden"></div>

    <h3 class="card-title" style="padding-left:0.25rem;margin-bottom:0.5rem;">Produtos</h3>
    <div class="busca-wrapper">
      <span class="busca-icon" data-icon="search" data-size="18"></span>
      <input type="search" id="busca-prod" placeholder="Buscar produto..." autocomplete="off">
      <button type="button" class="busca-clear" id="busca-clear" aria-label="Limpar busca"><span data-icon="x" data-size="16"></span></button>
    </div>
    <div id="cat-bar" class="cat-bar" role="tablist" aria-label="Filtro de categorias"></div>
    <div id="produtos-container">
      <div class="produtos-grid" id="produtos-loading" role="status" aria-busy="true" aria-label="Carregando produtos">
        <div class="skel-prod-card"><span class="skel skel-text" style="width:80%"></span><span class="skel skel-text" style="width:50%"></span><span class="skel skel-text" style="width:35%"></span></div>
        <div class="skel-prod-card"><span class="skel skel-text" style="width:70%"></span><span class="skel skel-text" style="width:55%"></span><span class="skel skel-text" style="width:40%"></span></div>
        <div class="skel-prod-card"><span class="skel skel-text" style="width:85%"></span><span class="skel skel-text" style="width:45%"></span><span class="skel skel-text" style="width:30%"></span></div>
        <div class="skel-prod-card"><span class="skel skel-text" style="width:75%"></span><span class="skel skel-text" style="width:60%"></span><span class="skel skel-text" style="width:38%"></span></div>
        <div class="skel-prod-card"><span class="skel skel-text" style="width:65%"></span><span class="skel skel-text" style="width:50%"></span><span class="skel skel-text" style="width:42%"></span></div>
        <div class="skel-prod-card"><span class="skel skel-text" style="width:78%"></span><span class="skel skel-text" style="width:55%"></span><span class="skel skel-text" style="width:36%"></span></div>
      </div>
    </div>
  </main>

  <!-- Barra POS do carrinho (fixa no rodapé) -->
  <div class="cart-bar" id="cart-bar" role="region" aria-label="Resumo do carrinho">
    <div class="resumo">
      <span class="resumo-label">Total do carrinho</span>
      <span class="resumo-total" id="fab-total">R$ 0,00</span>
      <span class="resumo-qtd" id="fab-qtd-label">0 itens</span>
    </div>
    <button class="btn-ver" id="fab-carrinho">
      <span data-icon="shopping-cart" data-size="18"></span>
      Ver carrinho
      <span class="badge" id="fab-qtd">0</span>
    </button>
  </div>

  <!-- Modal do carrinho -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <div class="modal-titulo">
        <span style="display:inline-flex;align-items:center;gap:0.4rem;"><span data-icon="shopping-cart" data-size="20"></span> Carrinho</span>
        <button onclick="fecharModal()" aria-label="Fechar" style="background:none;border:none;cursor:pointer;color:var(--cinza);display:inline-flex;padding:0.25rem;"><span data-icon="x" data-size="22"></span></button>
      </div>
      <div id="modal-itens"></div>
      <div class="modal-total">
        <span>Total</span>
        <span id="modal-total-val">R$ 0,00</span>
      </div>
      <div id="alerta-modal" class="alert hidden"></div>
      <button id="btn-finalizar" class="btn btn-success"><span data-icon="check" data-size="20"></span> Finalizar Venda</button>
      <button onclick="limparCarrinho()" class="btn btn-secondary mt-1" style="font-size:0.85rem;"><span data-icon="trash-2" data-size="16"></span> Limpar carrinho</button>
    </div>
  </div>

  <script type="module">
    import {
      db, doc, getDoc, collection, getDocs, serverTimestamp, runTransaction
    } from "../js/firebase-config.js";
    import { icon, renderIcons } from "../js/icons.js";
    import { requireAuth } from "../js/auth-guard.js";

    const { perfil } = await requireAuth({ papel: 'operador' });
    import { toast } from "../js/ui.js";
    import { fmtBRL } from "../js/helpers.js";

    // Evento ativo
    let eventoAtivo = null;
    getDoc(doc(db, 'config', 'eventoAtivo')).then(s => { if (s.exists()) eventoAtivo = s.data(); });

    const params = new URLSearchParams(window.location.search);
    const clienteId = params.get('cliente');
    if (!clienteId) window.location.href = 'index.html';

    const carrinho = new Map(); // produtoId -> { produto, qtd }
    let cliente = null;

    const $ = (id) => document.getElementById(id);

    // Vibração háptica — no-op se o device não suportar (desktop, iOS Safari < 16.4)
    const vibrar = (padrao) => { try { navigator.vibrate?.(padrao); } catch(_) {} };

    function mostrarAlerta(msg, tipo = 'info') {
      const alerta = $('alerta');
      alerta.textContent = msg;
      alerta.className = `alert alert-${tipo}`;
      alerta.classList.remove('hidden');
    }

    // ── Cliente ──────────────────────────────────────
    async function carregarCliente() {
      const snap = await getDoc(doc(db, 'clientes', clienteId));
      if (!snap.exists()) {
        $('cliente-nome').innerHTML = `<span style="display:inline-flex;align-items:center;gap:0.4rem;">${icon('x-circle', { size: 20 })} Não cadastrado</span>`;
        mostrarAlerta(`Cliente ${clienteId} não encontrado.`, 'danger');
        return;
      }
      cliente = { id: clienteId, ...snap.data() };
      $('cliente-nome').textContent = clienteId;
      atualizarSaldoExibido();
    }

    function atualizarSaldoExibido() {
      $('cliente-saldo').textContent = `R$ ${Number(cliente.saldo || 0).toFixed(2).replace('.', ',')}`;
    }

    // ── Produtos ─────────────────────────────────────
    let produtosCache = [];

    async function carregarProdutos() {
      const cont = $('produtos-container');
      const snap = await getDocs(collection(db, 'produtos'));
      if (snap.empty) {
        cont.innerHTML = `<div class="empty-state">${icon('package', { size: 32 })}<p>Nenhum produto cadastrado.</p></div>`;
        return;
      }
      produtosCache = [];
      snap.forEach(d => {
        const p = { id: d.id, ...d.data() };
        p.precoFinal = p.promocao && p.precoPromo ? p.precoPromo : p.preco;
        produtosCache.push(p);
      });
      // Ordem alfabética dentro de cada grupo
      produtosCache.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      renderizarCategorias();
      renderizarProdutos();
    }

    let categoriaAtiva = 'Todos';

    function renderizarCategorias() {
      const bar = $('cat-bar');
      const cats = Array.from(new Set(
        produtosCache.map(p => (p.categoria || 'Geral').trim() || 'Geral')
      )).sort((a, b) => a.localeCompare(b, 'pt-BR'));

      // Se só houver uma categoria (ou nenhuma), não mostra a barra
      if (cats.length <= 1) {
        bar.style.display = 'none';
        categoriaAtiva = 'Todos';
        return;
      }
      bar.style.display = '';

      const opcoes = ['Todos', ...cats];
      bar.innerHTML = '';
      opcoes.forEach(cat => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'cat-chip' + (cat === categoriaAtiva ? ' ativo' : '');
        chip.textContent = cat;
        chip.setAttribute('role', 'tab');
        chip.setAttribute('aria-selected', cat === categoriaAtiva ? 'true' : 'false');
        chip.onclick = () => {
          categoriaAtiva = cat;
          bar.querySelectorAll('.cat-chip').forEach(c => {
            const ativo = c.textContent === cat;
            c.classList.toggle('ativo', ativo);
            c.setAttribute('aria-selected', ativo ? 'true' : 'false');
          });
          renderizarProdutos();
        };
        bar.appendChild(chip);
      });
    }

    // Normaliza pra busca (case + acento insensitive)
    const norm = (s) => (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '');

    function renderizarProdutos() {
      const cont = $('produtos-container');
      const termo = norm($('busca-prod').value.trim());
      const porCategoria = categoriaAtiva && categoriaAtiva !== 'Todos'
        ? produtosCache.filter(p => ((p.categoria || 'Geral').trim() || 'Geral') === categoriaAtiva)
        : produtosCache;
      const filtrados = termo
        ? porCategoria.filter(p => norm(p.nome).includes(termo) || norm(p.categoria).includes(termo))
        : porCategoria;

      if (filtrados.length === 0) {
        const msg = termo
          ? `Nenhum produto encontrado para "${$('busca-prod').value}".`
          : `Nenhum produto na categoria "${categoriaAtiva}".`;
        cont.innerHTML = `<div class="empty-state">${icon('search', { size: 32 })}<p>${msg}</p></div>`;
        return;
      }

      const favoritos = filtrados.filter(p => p.favorito);
      const demais    = filtrados.filter(p => !p.favorito);

      cont.innerHTML = '';

      // Quando há busca ativa, não separa em seções — só lista o resultado
      if (termo) {
        const grid = document.createElement('div');
        grid.className = 'produtos-grid';
        filtrados.forEach(p => grid.appendChild(criarCardProduto(p)));
        cont.appendChild(grid);
        return;
      }

      if (favoritos.length > 0) {
        const titFav = document.createElement('div');
        titFav.className = 'secao-titulo';
        titFav.innerHTML = `${icon('star', { size: 14 })} Favoritos`;
        cont.appendChild(titFav);
        const gridFav = document.createElement('div');
        gridFav.className = 'produtos-grid';
        favoritos.forEach(p => gridFav.appendChild(criarCardProduto(p)));
        cont.appendChild(gridFav);
      }

      if (demais.length > 0) {
        if (favoritos.length > 0) {
          const titAll = document.createElement('div');
          titAll.className = 'secao-titulo';
          titAll.style.color = 'var(--cinza)';
          titAll.innerHTML = 'Demais produtos';
          cont.appendChild(titAll);
        }
        const gridAll = document.createElement('div');
        gridAll.className = 'produtos-grid';
        demais.forEach(p => gridAll.appendChild(criarCardProduto(p)));
        cont.appendChild(gridAll);
      }

      // Re-aplica estado do carrinho aos cards recém-renderizados
      carrinho.forEach(({ qtd }, id) => atualizarCardProduto(id, qtd));
    }

    $('busca-prod').addEventListener('input', renderizarProdutos);
    $('busca-clear').addEventListener('click', () => {
      $('busca-prod').value = '';
      renderizarProdutos();
      $('busca-prod').focus();
    });

    function criarCardProduto(p) {
      const ESTOQUE_BAIXO = 10;
      const semEstoque = (p.estoque ?? 0) <= 0;
      const estoqueBaixo = !semEstoque && p.estoque <= ESTOQUE_BAIXO;
      const card = document.createElement('div');
      card.className = `prod-card ${semEstoque ? 'sem-estoque' : ''}`;
      card.id = `card-${p.id}`;

      const badgePromo = p.promocao
        ? `<span style="background:var(--vermelho);color:white;font-size:0.65rem;font-weight:700;padding:1px 6px;border-radius:999px;display:inline-flex;align-items:center;gap:3px;">${icon('tag', { size: 10 })} PROMO</span>`
        : '';
      const precoHtml = p.promocao && p.precoPromo
        ? `<div class="prod-preco-old">R$ ${Number(p.preco).toFixed(2).replace('.', ',')}</div>
           <div class="prod-preco promo">R$ ${Number(p.precoFinal).toFixed(2).replace('.', ',')}</div>`
        : `<div class="prod-preco">R$ ${Number(p.preco).toFixed(2).replace('.', ',')}</div>`;

      const estoqueHtml = semEstoque
        ? 'Sem estoque'
        : estoqueBaixo
          ? `${icon('alert-triangle', { size: 12 })} Restam ${p.estoque}`
          : `Est: ${p.estoque}`;
      const starHtml = p.favorito
        ? `<span class="fav-star" aria-label="Favorito">${icon('star', { size: 14 })}</span>`
        : '';
      card.innerHTML = `
        <span class="qtd-badge" id="badge-${p.id}" aria-hidden="true">0</span>
        ${starHtml}
        ${badgePromo}
        <div class="prod-nome">${p.nome}</div>
        ${precoHtml}
        <div class="prod-estoque" style="${estoqueBaixo ? 'color:var(--vermelho);font-weight:600;display:inline-flex;align-items:center;gap:3px;' : ''}">
          ${estoqueHtml}
        </div>
        <div class="prod-controle hidden" id="ctrl-${p.id}">
          <button class="btn-qtd btn-menos" data-id="${p.id}" aria-label="Diminuir">${icon('minus', { size: 18 })}</button>
          <span class="qtd-display" id="qtd-${p.id}">0</span>
          <button class="btn-qtd btn-mais" data-id="${p.id}" aria-label="Aumentar">${icon('plus', { size: 18 })}</button>
        </div>
        <button class="btn-adicionar" id="add-${p.id}">${icon('plus', { size: 16 })} Adicionar</button>
      `;

      card.querySelector(`#add-${p.id}`).onclick = () => adicionar(p);
      card.querySelector(`[data-id="${p.id}"].btn-mais`).onclick = () => adicionar(p);
      card.querySelector(`[data-id="${p.id}"].btn-menos`).onclick = () => remover(p.id);

      return card;
    }

    // ── Carrinho ──────────────────────────────────────
    function adicionar(p) {
      const atual = carrinho.get(p.id) || { produto: p, qtd: 0 };
      if (atual.qtd + 1 > p.estoque) {
        toast(`Estoque máximo de ${p.nome} atingido`, { tipo: 'erro' });
        return;
      }
      atual.qtd += 1;
      carrinho.set(p.id, atual);
      atualizarCardProduto(p.id, atual.qtd);
      atualizarFab();
      vibrar(15); // tap leve
    }

    function remover(produtoId) {
      const atual = carrinho.get(produtoId);
      if (!atual) return;
      atual.qtd -= 1;
      if (atual.qtd <= 0) carrinho.delete(produtoId);
      else carrinho.set(produtoId, atual);
      atualizarCardProduto(produtoId, atual.qtd <= 0 ? 0 : atual.qtd);
      atualizarFab();
      atualizarModal();
      vibrar(15);
    }

    window.limparCarrinho = () => {
      carrinho.forEach((_, id) => atualizarCardProduto(id, 0));
      carrinho.clear();
      atualizarFab();
      fecharModal();
    };

    function atualizarCardProduto(id, qtd) {
      const ctrl = $(`ctrl-${id}`);
      const addBtn = $(`add-${id}`);
      const qtdEl = $(`qtd-${id}`);
      const badge = $(`badge-${id}`);
      const card = $(`card-${id}`);
      if (!ctrl) return;
      if (qtd > 0) {
        ctrl.classList.remove('hidden');
        addBtn.classList.add('hidden');
        qtdEl.textContent = qtd;
        if (badge) badge.textContent = qtd;
        card.classList.add('no-carrinho');
      } else {
        ctrl.classList.add('hidden');
        addBtn.classList.remove('hidden');
        card.classList.remove('no-carrinho');
      }
    }

    function totalCarrinho() {
      return Array.from(carrinho.values())
        .reduce((s, { produto, qtd }) => s + (produto.precoFinal ?? produto.preco) * qtd, 0);
    }

    function qtdTotalCarrinho() {
      return Array.from(carrinho.values()).reduce((s, { qtd }) => s + qtd, 0);
    }

    function atualizarFab() {
      const bar = $('cart-bar');
      const total = totalCarrinho();
      const qtd = qtdTotalCarrinho();
      if (qtd === 0) {
        bar.classList.remove('aberta');
      } else {
        bar.classList.add('aberta');
        $('fab-qtd').textContent = qtd;
        $('fab-qtd-label').textContent = qtd === 1 ? '1 item' : `${qtd} itens`;
        $('fab-total').textContent = fmtBRL(total);
      }
    }

    function atualizarModal() {
      const itensDiv = $('modal-itens');
      itensDiv.innerHTML = '';
      carrinho.forEach(({ produto, qtd }) => {
        const preco = produto.precoFinal ?? produto.preco;
        const div = document.createElement('div');
        div.className = 'modal-item';
        const promoTag = produto.promocao
          ? ` <span style="color:var(--vermelho);display:inline-flex;vertical-align:middle;">${icon('tag', { size: 12 })}</span>`
          : '';
        div.innerHTML = `
          <div class="modal-item-nome">${produto.nome}${promoTag}<br>
            <span style="font-size:0.8rem;color:var(--cinza);">${fmtBRL(preco)} cada</span>
          </div>
          <div class="modal-item-ctrl">
            <button class="btn-qtd btn-menos" data-mid="${produto.id}" aria-label="Diminuir">${icon('minus', { size: 18 })}</button>
            <span class="qtd-display">${qtd}</span>
            <button class="btn-qtd btn-mais" data-mid="${produto.id}" aria-label="Aumentar">${icon('plus', { size: 18 })}</button>
          </div>
          <div style="font-weight:700;min-width:64px;text-align:right;">${fmtBRL(preco * qtd)}</div>
        `;
        div.querySelector(`[data-mid="${produto.id}"].btn-mais`).onclick = () => { adicionar(produto); atualizarModal(); };
        div.querySelector(`[data-mid="${produto.id}"].btn-menos`).onclick = () => { remover(produto.id); };
        itensDiv.appendChild(div);
      });
      $('modal-total-val').textContent = fmtBRL(totalCarrinho());
    }

    window.fecharModal = () => $('modal-overlay').classList.remove('aberto');

    $('fab-carrinho').onclick = () => {
      atualizarModal();
      $('modal-overlay').classList.add('aberto');
      $('alerta-modal').classList.add('hidden');
    };

    $('modal-overlay').onclick = (e) => { if (e.target === $('modal-overlay')) fecharModal(); };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && $('modal-overlay').classList.contains('aberto')) fecharModal();
    });

    // ── Finalizar ─────────────────────────────────────
    $('btn-finalizar').onclick = async () => {
      if (!cliente) return;
      if (carrinho.size === 0) return;

      const total = totalCarrinho();
      const alertaModal = $('alerta-modal');

      if ((cliente.saldo || 0) < total) {
        alertaModal.textContent = `Saldo insuficiente. Falta ${fmtBRL(total - cliente.saldo)}`;
        alertaModal.className = 'alert alert-danger';
        return;
      }

      $('btn-finalizar').disabled = true;
      $('btn-finalizar').innerHTML = '<div class="loader"></div> Processando...';

      // Se o servidor demorar pra confirmar (wifi/3G ruim), avisa o operador
      // que ainda está aguardando — não trava nem cancela a transação.
      const timerLento = setTimeout(() => {
        $('btn-finalizar').innerHTML = '<div class="loader"></div> Conexão lenta — aguardando servidor…';
      }, 5000);

      let vendaIdGerado = null;
      let saldoFinal = null;

      try {
        await runTransaction(db, async (tx) => {
          const clienteRef = doc(db, 'clientes', cliente.id);
          const itensCarrinho = Array.from(carrinho.values());
          const prodRefs = itensCarrinho.map(({ produto }) => doc(db, 'produtos', produto.id));

          // Firestore exige TODOS os reads antes de qualquer write
          const clienteSnap = await tx.get(clienteRef);
          const prodSnaps = await Promise.all(prodRefs.map(r => tx.get(r)));

          const saldoAtual = clienteSnap.data().saldo || 0;
          if (saldoAtual < total) throw new Error('Saldo insuficiente');

          itensCarrinho.forEach(({ produto, qtd }, i) => {
            const estAtual = prodSnaps[i].data().estoque || 0;
            if (estAtual < qtd) throw new Error(`Estoque insuficiente: ${produto.nome}`);
            tx.update(prodRefs[i], { estoque: estAtual - qtd });
          });

          // Captura o saldo final DA TX — o `cliente.saldo` em memória pode
          // estar stale se alguma recarga aconteceu em paralelo.
          saldoFinal = saldoAtual - total;
          tx.update(clienteRef, { saldo: saldoFinal });

          const vendaRef = doc(collection(db, 'vendas'));
          vendaIdGerado = vendaRef.id;
          tx.set(vendaRef, {
            clienteId: cliente.id,
            clienteNome: cliente.id,   // mesmo valor por ora; campo já existe pra quando tiver nome
            eventoId: eventoAtivo?.id || null,
            eventoNome: eventoAtivo?.nome || null,
            itens: Array.from(carrinho.values()).map(({ produto, qtd }) => ({
              produtoId: produto.id,
              nome: produto.nome,
              preco: produto.precoFinal ?? produto.preco,
              promocao: produto.promocao || false,
              qtd,
              subtotal: (produto.precoFinal ?? produto.preco) * qtd
            })),
            total,
            operadorId: perfil?.uid || null,
            operadorNome: perfil?.nome || perfil?.email || 'Operador',
            criadoEm: serverTimestamp()
          });
        });

        clearTimeout(timerLento);
        fecharModal();
        cliente.saldo = saldoFinal;
        atualizarSaldoExibido();
        const idCurto = (vendaIdGerado || '').slice(-6).toUpperCase();
        toast(`Venda #${idCurto} — ${fmtBRL(total)} · saldo final ${fmtBRL(saldoFinal)}`, {
          tipo: 'sucesso',
          duracao: 2500,
        });
        setTimeout(() => window.location.href = 'index.html', 2500);
      } catch (err) {
        clearTimeout(timerLento);
        vibrar([100, 50, 100]); // padrão de erro

        // Diferencia os tipos de erro pra dar mensagem útil pro operador.
        // Contenção de transação (raro, mas possível com vários operadores
        // vendendo o mesmo produto ao mesmo tempo) gera FAILED_PRECONDITION
        // ou ABORTED — nesse caso a venda NÃO foi cobrada, só clicar de novo.
        let mensagem;
        const eContencao = err.code === 'failed-precondition'
                        || err.code === 'aborted'
                        || /stored version/i.test(err.message || '');
        if (err.message === 'Saldo insuficiente') {
          mensagem = 'Saldo insuficiente pra essa venda.';
        } else if ((err.message || '').startsWith('Estoque insuficiente')) {
          mensagem = err.message + '. Atualize a tela e tente de novo.';
        } else if (eContencao) {
          mensagem = 'Conflito com outra venda simultânea. A venda NÃO foi cobrada — clique Finalizar de novo.';
        } else {
          mensagem = `Erro: ${err.message}. Tente de novo.`;
        }
        $('alerta-modal').textContent = mensagem;
        $('alerta-modal').className = 'alert alert-danger';
        $('btn-finalizar').disabled = false;
        $('btn-finalizar').innerHTML = `${icon('check', { size: 20 })} Finalizar Venda`;
      }
    };

    carregarCliente();
    carregarProdutos();
  </script>
</body>
</html>

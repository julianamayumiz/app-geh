<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — App GEH</title>
  <script>(function(){try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/assets/logo.png">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <main class="erro-404">
    <div>
      <div class="codigo">404</div>
      <h1>Página não encontrada</h1>
      <p>O link que você abriu não existe — talvez tenha sido renomeado ou removido.</p>
      <div class="acoes">
        <a href="/" class="btn btn-primary">⌂ Início</a>
        <button type="button" class="btn btn-secondary" onclick="history.back()">← Voltar</button>
      </div>
    </div>
  </main>
</body>
</html>

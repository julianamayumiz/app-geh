<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E3A8A">
  <title>Meus convites — App GEH</title>
  <script>(function(){try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <script src="/js/sw-register.js"></script>
  <style>
    body { max-width: 480px; margin: 0 auto; padding: 1rem; }
    .familia-header {
      background: linear-gradient(135deg, var(--azul) 0%, var(--azul-escuro) 100%);
      color: #fff;
      border-radius: 16px;
      padding: 1.1rem 1.25rem;
      margin-bottom: 1.25rem;
    }
    .familia-header h1 { margin: 0 0 0.5rem; font-size: 1.2rem; }
    .progresso-barra {
      height: 8px;
      background: rgba(255,255,255,0.25);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .progresso-fill {
      height: 100%;
      background: var(--amarelo-acento);
      transition: width 0.3s ease;
    }
    .convite-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--cinza-fundo);
      border: 1px solid var(--cinza-claro);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.6rem;
      cursor: pointer;
    }
    .convite-card .num { font-weight: 700; color: var(--azul); margin-right: 0.75rem; }
    .convite-card .nome { flex: 1; }
    .convite-card .vazio { color: var(--cinza); }
    .convite-card .acao { color: var(--azul); font-weight: 600; font-size: 0.85rem; }
    #tela-codigo { text-align: center; padding-top: 2rem; }
    #tela-codigo input { text-align: center; margin: 1rem 0; }
    .badge-situacao {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-left: 0.4rem;
      white-space: nowrap;
    }
    .badge-situacao.pago { background: rgba(22,163,74,0.14); color: var(--verde); }
    .badge-situacao.reservado { background: rgba(180,83,9,0.14); color: var(--amarelo-acento); }
    .badge-situacao.nao_vendido { background: var(--cinza-claro); color: var(--cinza); }
    .situacao-grupo {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .situacao-btn {
      flex: 1;
      min-height: 44px;
      padding: 0.75rem 0.25rem;
      border-radius: 10px;
      border: 2px solid var(--cinza-claro);
      background: transparent;
      color: var(--cinza-escuro);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .situacao-btn.ativo.pago { border-color: var(--verde); background: rgba(22,163,74,0.14); color: var(--verde); }
    .situacao-btn.ativo.reservado { border-color: var(--amarelo-acento); background: rgba(180,83,9,0.14); color: var(--amarelo-acento); }
    .situacao-btn.ativo.nao_vendido { border-color: var(--cinza); background: var(--cinza-claro); color: var(--cinza-escuro); }
  </style>
</head>
<body>
  <div id="tela-codigo" class="hidden">
    <span data-icon="ticket" data-size="40"></span>
    <h2 style="color:var(--azul);">Meus convites</h2>
    <p style="color:var(--cinza);">Cole abaixo o código de acesso que sua família recebeu da diretoria.</p>
    <form id="form-codigo">
      <label for="input-codigo" class="sr-only">Código de acesso</label>
      <input type="text" id="input-codigo" placeholder="Código de acesso" required>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
  </div>

  <div id="tela-erro" class="hidden" style="text-align:center;padding-top:2rem;">
    <span data-icon="x-circle" data-size="40" style="color:#B91C1C;"></span>
    <h2 style="color:var(--azul);">Código inválido</h2>
    <p style="color:var(--cinza);">Esse link não é válido ou não está mais ativo. Fale com a diretoria do grupo.</p>
  </div>

  <div id="tela-convites" class="hidden">
    <div class="familia-header">
      <h1 id="familia-nome">Família</h1>
      <div id="familia-resumo"></div>
      <div class="progresso-barra"><div class="progresso-fill" id="progresso-fill" style="width:0%"></div></div>
    </div>
    <div id="lista-convites"></div>
  </div>

  <script type="module">
    import { esc } from "../js/helpers.js";
    import {
      db, collection, doc, getDoc, getDocs, updateDoc, query, where, onSnapshot
    } from "../js/firebase-config.js";
    import { icon, renderIcons } from "../js/icons.js";
    import { toast } from "../js/ui.js";

    renderIcons();
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    let familiaId = params.get('codigo');

    async function init() {
      if (!familiaId) {
        $('tela-codigo').classList.remove('hidden');
        $('form-codigo').addEventListener('submit', (e) => {
          e.preventDefault();
          const codigo = $('input-codigo').value.trim();
          if (!codigo) return;
          location.href = `convites.html?codigo=${encodeURIComponent(codigo)}`;
        });
        return;
      }

      let familiaSnap;
      try {
        familiaSnap = await getDoc(doc(db, 'familias', familiaId));
      } catch (err) {
        console.error('[familia/convites] erro ao carregar familia:', err);
        $('tela-erro').classList.remove('hidden');
        renderIcons();
        return;
      }
      if (!familiaSnap.exists() || familiaSnap.data().ativo === false) {
        $('tela-erro').classList.remove('hidden');
        renderIcons();
        return;
      }

      $('familia-nome').textContent = `Família ${familiaSnap.data().nome}`;
      $('tela-convites').classList.remove('hidden');
      renderIcons();

      onSnapshot(
        query(collection(db, 'convites_antecipados'), where('familiaId', '==', familiaId)),
        (snap) => {
          const convites = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderConvites(convites);
        },
        (err) => {
          console.error('[familia/convites] onSnapshot erro:', err);
          $('lista-convites').innerHTML = '<div class="alert alert-danger">Erro ao carregar seus convites. Recarregue a página.</div>';
        }
      );
    }

    // Situação atual do convite, com fallback pros campos antigos
    // (pago/nome) em convites de antes dessa funcionalidade existir.
    function situacaoAtual(c) {
      if (c.situacao) return c.situacao;
      if (!c.nome) return 'nao_vendido';
      return c.pago === false ? 'reservado' : 'pago';
    }
    const LABEL_SITUACAO = { pago: 'Pago', reservado: 'Reservado', nao_vendido: 'Não vendido' };

    function renderConvites(convites) {
      convites.sort((a, b) => (parseInt(a.numero) || 0) - (parseInt(b.numero) || 0));
      const total = convites.length;
      const preenchidos = convites.filter(c => c.nome).length;
      const pagos = convites.filter(c => situacaoAtual(c) === 'pago').length;
      $('familia-resumo').textContent = `${total} convite${total === 1 ? '' : 's'} · ${preenchidos} preenchido${preenchidos === 1 ? '' : 's'} · ${pagos} pago${pagos === 1 ? '' : 's'}`;
      $('progresso-fill').style.width = total > 0 ? `${(preenchidos / total) * 100}%` : '0%';

      $('lista-convites').innerHTML = convites.map(c => {
        const sit = situacaoAtual(c);
        return `
        <div class="convite-card" data-abrir="${esc(c.id)}">
          <span class="num">[${esc(c.numero)}]</span>
          <span class="nome ${c.nome ? '' : 'vazio'}">${c.nome ? esc(c.nome) : '— sem convidado'}</span>
          <span class="badge-situacao ${sit}">${LABEL_SITUACAO[sit]}</span>
          <span class="acao">${c.nome ? '✓ Editar' : '+ Adicionar'}</span>
        </div>
      `;
      }).join('');

      document.querySelectorAll('[data-abrir]').forEach(el => {
        el.onclick = () => abrirFormulario(convites.find(c => c.id === el.dataset.abrir));
      });
    }

    function abrirFormulario(convite) {
      const outrosNomes = new Set(); // preenchido depois, ao checar duplicidade
      let situacaoEscolhida = situacaoAtual(convite);
      const backdrop = document.createElement('div');
      backdrop.className = 'confirm-backdrop';
      backdrop.innerHTML = `
        <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="conv-titulo">
          <p id="conv-titulo" style="font-weight:700;margin-bottom:0.75rem;">Convite ${esc(convite.numero)}</p>
          <label for="input-nome-convidado">Nome do convidado</label>
          <input type="text" id="input-nome-convidado" value="${esc(convite.nome || '')}" maxlength="80" style="margin-bottom:0.75rem;">
          <label id="lbl-situacao" style="display:block;margin-bottom:0.4rem;">Situação</label>
          <div class="situacao-grupo" role="group" aria-labelledby="lbl-situacao">
            <button type="button" class="situacao-btn pago" data-situacao="pago" aria-label="Marcar como pago">Pago</button>
            <button type="button" class="situacao-btn reservado" data-situacao="reservado" aria-label="Marcar como reservado">Reservado</button>
            <button type="button" class="situacao-btn nao_vendido" data-situacao="nao_vendido" aria-label="Marcar como não vendido">Não vendido</button>
          </div>
          <div id="aviso-duplicidade" class="alert alert-warning hidden" style="margin-top:0.75rem;"></div>
          <div class="confirm-acoes" style="margin-top:1.25rem;">
            <button type="button" class="btn btn-secondary" data-acao="cancelar">Cancelar</button>
            <button type="button" class="btn btn-primary" data-acao="salvar">Salvar</button>
          </div>
        </div>
      `;
      document.body.appendChild(backdrop);
      const fechar = () => backdrop.remove();
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) fechar(); });
      backdrop.querySelector('[data-acao="cancelar"]').onclick = fechar;
      backdrop.querySelector('#input-nome-convidado').addEventListener('input', () => {
        delete backdrop.dataset.confirmouDup;
        const aviso = backdrop.querySelector('#aviso-duplicidade');
        aviso.classList.add('hidden');
        aviso.textContent = '';
      });

      const botoesSituacao = backdrop.querySelectorAll('.situacao-btn');
      const marcarSituacao = (valor) => {
        situacaoEscolhida = valor;
        botoesSituacao.forEach(b => b.classList.toggle('ativo', b.dataset.situacao === valor));
      };
      botoesSituacao.forEach(b => b.onclick = () => marcarSituacao(b.dataset.situacao));
      marcarSituacao(situacaoEscolhida);

      getDocs(query(collection(db, 'convites_antecipados'), where('familiaId', '==', familiaId))).then(snap => {
        snap.docs.forEach(d => {
          if (d.id === convite.id) return;
          const nome = (d.data().nome || '').trim().toLowerCase();
          if (nome) outrosNomes.add(nome);
        });
      });

      backdrop.querySelector('[data-acao="salvar"]').onclick = async () => {
        const nome = backdrop.querySelector('#input-nome-convidado').value.trim();
        if (situacaoEscolhida !== 'nao_vendido' && nome.length < 2) {
          toast('Digite o nome do convidado (ou marque como "Não vendido").', { tipo: 'erro' });
          return;
        }
        if (nome && outrosNomes.has(nome.toLowerCase())) {
          const aviso = backdrop.querySelector('#aviso-duplicidade');
          aviso.textContent = 'Esse nome já está em outro convite seu. Confirma mesmo assim?';
          aviso.classList.remove('hidden');
          if (!backdrop.dataset.confirmouDup) {
            backdrop.dataset.confirmouDup = '1';
            return;
          }
        }
        try {
          await updateDoc(doc(db, 'convites_antecipados', convite.id), {
            nome,
            situacao: situacaoEscolhida,
            pago: situacaoEscolhida === 'pago',
          });
          toast('Convite atualizado!', { tipo: 'sucesso' });
          fechar();
        } catch (err) {
          toast(`Erro ao salvar: ${err.message}`, { tipo: 'erro' });
        }
      };
    }

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — Admin GEH</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</head>
<body>
  <main class="admin">
    <h2 style="color:var(--azul);margin-bottom:1rem;">👥 Clientes</h2>

    <div class="card">
      <h3 class="card-title">Cadastrar cliente</h3>
      <p class="text-muted" style="font-size:0.85rem;margin-bottom:0.75rem;">
        O <strong>ID</strong> é o código que está no QR impresso do cliente (ex: GEH001, GEH002...).
      </p>
      <div class="form-group">
        <label>ID do QR code</label>
        <input type="text" id="cli-id" placeholder="GEH001" style="max-width:200px;">
      </div>
      <div id="alerta" class="alert hidden"></div>
      <button id="btn-salvar" class="btn btn-primary" style="max-width:200px;">Cadastrar</button>
    </div>

    <div class="card">
      <h3 class="card-title">Cadastrar em lote</h3>
      <p class="text-muted" style="font-size:0.85rem;margin-bottom:0.75rem;">
        Cole uma lista de IDs, um por linha (ex: GEH001, GEH002...). IDs já cadastrados serão ignorados.
      </p>
      <div class="form-group">
        <label>Lista de IDs</label>
        <textarea id="lote-ids" rows="6" placeholder="GEH001&#10;GEH002&#10;GEH003&#10;..." style="font-family:monospace;font-size:0.9rem;"></textarea>
      </div>
      <div id="alerta-lote" class="alert hidden"></div>
      <button id="btn-lote" class="btn btn-primary" style="max-width:220px;">Importar lote</button>
    </div>

    <div class="card">
      <div class="form-group" style="margin-bottom:0;">
        <label>🔍 Buscar cliente</label>
        <input type="text" id="busca" placeholder="Digite o ID...">
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr><th>ID</th><th>Saldo</th><th></th></tr>
        </thead>
        <tbody id="tbl"><tr><td colspan="3" class="text-center text-muted">Carregando...</td></tr></tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { montarNav, fmtBRL } from "./_nav.js";
    import { db, collection, doc, setDoc, getDoc, getDocs, deleteDoc, onSnapshot, writeBatch } from "../js/firebase-config.js";

    montarNav('clientes.html');

    const $ = (id) => document.getElementById(id);
    const alerta = $('alerta');
    let todos = [];

    $('btn-salvar').onclick = async () => {
      const id = $('cli-id').value.trim();
      if (!id) {
        alerta.textContent = 'Preencha o ID do QR code.';
        alerta.className = 'alert alert-warning';
        return;
      }
      try {
        const ref = doc(db, 'clientes', id);
        const existe = await getDoc(ref);
        if (existe.exists()) {
          alerta.textContent = `Já existe cliente com ID "${id}".`;
          alerta.className = 'alert alert-danger';
          return;
        }
        await setDoc(ref, { saldo: 0 });
        $('cli-id').value = '';
        alerta.textContent = `✓ Cliente "${id}" cadastrado.`;
        alerta.className = 'alert alert-success';
        setTimeout(() => alerta.classList.add('hidden'), 2000);
      } catch (err) {
        alerta.textContent = `Erro: ${err.message}`;
        alerta.className = 'alert alert-danger';
      }
    };

    function renderizar() {
      const filtro = $('busca').value.trim().toLowerCase();
      const tbody = $('tbl');
      tbody.innerHTML = '';
      const lista = todos.filter(c => !filtro || c.id.toLowerCase().includes(filtro));
      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Nenhum cliente encontrado.</td></tr>';
        return;
      }
      lista.forEach(c => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${c.id}</strong></td>
          <td>${fmtBRL(c.saldo)}</td>
          <td>
            <button class="btn btn-danger" style="width:auto;padding:0.35rem 0.75rem;font-size:0.85rem;" data-del="${c.id}">Excluir</button>
          </td>
        `;
        tr.querySelector('[data-del]').onclick = async () => {
          if (!confirm(`Excluir cliente "${c.id}"? Saldo: ${fmtBRL(c.saldo)}`)) return;
          await deleteDoc(doc(db, 'clientes', c.id));
        };
        tbody.appendChild(tr);
      });
    }

    $('btn-lote').onclick = async () => {
      const texto = $('lote-ids').value.trim();
      if (!texto) return;

      const ids = [...new Set(
        texto.split('\n').map(l => l.trim()).filter(l => l.length > 0)
      )];

      if (ids.length === 0) return;
      if (!confirm(`Importar ${ids.length} clientes?`)) return;

      $('btn-lote').disabled = true;
      $('btn-lote').innerHTML = '<div class="loader" style="border-top-color:white"></div> Importando...';

      const alertaLote = $('alerta-lote');
      let criados = 0, ignorados = 0;

      // Firestore batch aceita até 500 por vez
      const LIMITE = 500;
      for (let i = 0; i < ids.length; i += LIMITE) {
        const chunk = ids.slice(i, i + LIMITE);
        const batch = writeBatch(db);
        for (const id of chunk) {
          const ref = doc(db, 'clientes', id);
          const existe = await getDoc(ref);
          if (existe.exists()) { ignorados++; continue; }
          batch.set(ref, { saldo: 0 });
          criados++;
        }
        await batch.commit();
      }

      $('lote-ids').value = '';
      alertaLote.textContent = `✓ ${criados} cadastrados, ${ignorados} já existiam.`;
      alertaLote.className = 'alert alert-success';
      $('btn-lote').disabled = false;
      $('btn-lote').innerHTML = 'Importar lote';
      setTimeout(() => alertaLote.classList.add('hidden'), 4000);
    };

    $('busca').oninput = renderizar;

    onSnapshot(collection(db, 'clientes'), (snap) => {
      todos = [];
      snap.forEach(d => todos.push({ id: d.id, ...d.data() }));
      todos.sort((a, b) => a.id.localeCompare(b.id));
      renderizar();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico — Admin GEH</title>
  <script>(function(){try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</head>
<body>
  <main class="admin">
    <h2 style="color:var(--azul);margin-bottom:1rem;display:inline-flex;align-items:center;gap:0.5rem;"><span data-icon="search" data-size="24"></span> Histórico por Cliente</h2>

    <div class="card">
      <div style="display:flex;gap:0.75rem;align-items:flex-end;">
        <div class="form-group" style="flex:1;margin-bottom:0;">
          <label for="busca-id">ID do cliente (QR code)</label>
          <input type="text" id="busca-id" placeholder="Ex: GEH001" autocomplete="off">
        </div>
        <button id="btn-buscar" class="btn btn-primary" style="width:auto;padding:0.75rem 1.25rem;">Buscar</button>
      </div>

      <div class="form-group" style="margin-top:0.75rem;margin-bottom:0;">
        <label for="sel-evento">Filtrar por evento</label>
        <select id="sel-evento">
          <option value="">Todos os eventos</option>
        </select>
      </div>

      <div id="clientes-lista" class="hidden" style="margin-top:0.75rem;">
        <p style="font-size:0.85rem;color:var(--cinza);margin-bottom:0.5rem;">Clientes cadastrados:</p>
        <div id="chips" style="display:flex;flex-wrap:wrap;gap:0.5rem;"></div>
      </div>
    </div>

    <div id="resultado" class="hidden">
      <div class="cliente-info" style="margin-bottom:1rem;">
        <div class="nome" id="res-id">—</div>
        <div class="saldo-label">Saldo atual</div>
        <div class="saldo" id="res-saldo">R$ 0,00</div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
        <div class="card" style="margin-bottom:0;">
          <div class="text-muted">Total recarregado</div>
          <div style="font-size:1.5rem;font-weight:700;color:var(--verde);" id="res-total-recarga">R$ 0,00</div>
        </div>
        <div class="card" style="margin-bottom:0;">
          <div class="text-muted">Total gasto</div>
          <div style="font-size:1.5rem;font-weight:700;color:var(--vermelho);" id="res-total-gasto">R$ 0,00</div>
        </div>
      </div>

      <h3 style="color:var(--azul);margin-bottom:0.75rem;">Movimentações</h3>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Quando</th><th>Tipo</th><th>Detalhe</th><th>Valor</th></tr></thead>
          <tbody id="tbl-mov"></tbody>
        </table>
      </div>
    </div>

    <div id="sem-resultado" class="alert alert-warning hidden">Cliente não encontrado.</div>
  </main>

  <script type="module">
    import { montarNav } from "./_nav.js";
    import { fmtBRL, esc } from "../js/helpers.js";
    import {
      db, collection, doc, getDoc, getDocs, query, where, orderBy, limit
    } from "../js/firebase-config.js";
    import { icon, renderIcons } from "../js/icons.js";
    import { abrirDetalhe } from "../js/ui.js";

    montarNav('historico.html');
    renderIcons();

    const $ = (id) => document.getElementById(id);
    let todosClientes = [];
    let ultimoIdBuscado = '';
    // Map venda-id → dados completos pra abrir modal de detalhe
    const vendasPorId = new Map();

    // Carregar eventos no select
    async function carregarEventos() {
      const snap = await getDocs(collection(db, 'eventos'));
      const sel = $('sel-evento');
      snap.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = d.data().nome;
        sel.appendChild(opt);
      });
      sel.onchange = () => { if (ultimoIdBuscado) buscar(ultimoIdBuscado); };
    }

    // Carregar lista de IDs pra sugestão
    async function carregarClientes() {
      const snap = await getDocs(collection(db, 'clientes'));
      todosClientes = [];
      snap.forEach(d => todosClientes.push(d.id));
      todosClientes.sort();
      renderChips('');
      $('clientes-lista').classList.remove('hidden');
    }

    function renderChips(filtro) {
      const chips = $('chips');
      chips.innerHTML = '';
      const lista = filtro
        ? todosClientes.filter(id => id.toLowerCase().includes(filtro.toLowerCase()))
        : todosClientes;
      lista.slice(0, 20).forEach(id => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip-cliente';
        btn.textContent = id;
        btn.onclick = () => { $('busca-id').value = id; buscar(id); };
        chips.appendChild(btn);
      });
      if (lista.length > 20) {
        chips.innerHTML += `<span class="text-muted" style="font-size:0.8rem;">+${lista.length - 20} clientes</span>`;
      }
    }

    $('busca-id').oninput = () => renderChips($('busca-id').value);
    $('btn-buscar').onclick = () => buscar($('busca-id').value.trim());
    $('busca-id').onkeydown = (e) => { if (e.key === 'Enter') buscar($('busca-id').value.trim()); };

    async function buscar(id) {
      if (!id) return;
      ultimoIdBuscado = id;
      $('resultado').classList.add('hidden');
      $('sem-resultado').classList.add('hidden');
      $('btn-buscar').disabled = true;
      try {

      const clienteSnap = await getDoc(doc(db, 'clientes', id));
      if (!clienteSnap.exists()) {
        $('sem-resultado').classList.remove('hidden');
        return;
      }

      const saldo = clienteSnap.data().saldo || 0;
      $('res-id').textContent = id;
      $('res-saldo').textContent = fmtBRL(saldo);

      // Filtro por evento aplicado a vendas e movimentações
      const eventoId = $('sel-evento').value;
      const filtrarPorEvento = (col) => eventoId
        ? query(collection(db, col), where('clienteId', '==', id), where('eventoId', '==', eventoId), orderBy('criadoEm', 'desc'), limit(50))
        : query(collection(db, col), where('clienteId', '==', id), orderBy('criadoEm', 'desc'), limit(50));

      // Transferencias usam origemId/destinoId em vez de clienteId, entao
      // duas queries separadas (Firestore nao tem OR cross-field facil).
      const filtrarTransfer = (campo) => eventoId
        ? query(collection(db, 'transferencias_saldo'), where(campo, '==', id), where('eventoId', '==', eventoId), orderBy('criadoEm', 'desc'), limit(50))
        : query(collection(db, 'transferencias_saldo'), where(campo, '==', id), orderBy('criadoEm', 'desc'), limit(50));

      // Buscar movimentações de saldo (recargas), vendas, ajustes manuais e transferencias
      const [movSnap, vendasSnap, ajustesSnap, transfOrigemSnap, transfDestinoSnap] = await Promise.all([
        getDocs(filtrarPorEvento('movimentacoes_saldo')),
        getDocs(filtrarPorEvento('vendas')),
        getDocs(filtrarPorEvento('ajustes_saldo')),
        getDocs(filtrarTransfer('origemId')),
        getDocs(filtrarTransfer('destinoId')),
      ]);

      // Montar lista unificada
      const movimentos = [];
      let totalRecarga = 0, totalGasto = 0;

      movSnap.forEach(d => {
        const m = d.data();
        totalRecarga += m.valor || 0;
        movimentos.push({
          quando: m.criadoEm?.toDate?.() || new Date(0),
          tipo: 'recarga',
          detalhe: `Via ${esc(m.forma || '—')}${m.caixaNome ? ` · caixa ${esc(m.caixaNome)}` : ''}`,
          valor: m.valor,
          positivo: true,
          cor: 'var(--verde)'
        });
      });

      vendasPorId.clear();
      vendasSnap.forEach(d => {
        const v = d.data();
        totalGasto += v.total || 0;
        const itens = (v.itens || []).map(i => `${i.qtd}× ${esc(i.nome)}`).join(', ');
        vendasPorId.set(d.id, { ...v, _id: d.id });
        movimentos.push({
          quando: v.criadoEm?.toDate?.() || new Date(0),
          tipo: 'venda',
          detalhe: itens,
          valor: v.total,
          positivo: false,
          cor: 'var(--vermelho)',
          vendaId: d.id,
        });
      });

      ajustesSnap.forEach(d => {
        const a = d.data();
        const v = a.valor || 0;
        movimentos.push({
          quando: a.criadoEm?.toDate?.() || new Date(0),
          tipo: 'ajuste',
          detalhe: `${esc(a.motivo || '—')}${a.adminNome ? ` · por ${esc(a.adminNome)}` : ''}`,
          valor: Math.abs(v),
          positivo: v >= 0,
          cor: 'var(--amarelo-acento)'
        });
      });

      // Transferencias — duas pernas. Origem perde, destino ganha.
      // Nao entram em totalRecarga/totalGasto porque nao movimentam dinheiro
      // de fato — so realocam saldo entre clientes.
      transfOrigemSnap.forEach(d => {
        const t = d.data();
        const para = t.destinoNome ? `${esc(t.destinoId)} (${esc(t.destinoNome)})` : esc(t.destinoId);
        const quem = esc(t.usuarioNome || t.usuarioEmail || '—');
        movimentos.push({
          quando: t.criadoEm?.toDate?.() || new Date(0),
          tipo: 'transfer ↗',
          detalhe: `Enviado para ${para}${t.motivo ? ` · ${esc(t.motivo)}` : ''} · por ${quem}`,
          valor: t.valor || 0,
          positivo: false,
          cor: 'var(--azul)'
        });
      });
      transfDestinoSnap.forEach(d => {
        const t = d.data();
        const de = t.origemNome ? `${esc(t.origemId)} (${esc(t.origemNome)})` : esc(t.origemId);
        const quem = esc(t.usuarioNome || t.usuarioEmail || '—');
        movimentos.push({
          quando: t.criadoEm?.toDate?.() || new Date(0),
          tipo: 'transfer ↙',
          detalhe: `Recebido de ${de}${t.motivo ? ` · ${esc(t.motivo)}` : ''} · por ${quem}`,
          valor: t.valor || 0,
          positivo: true,
          cor: 'var(--azul)'
        });
      });

      movimentos.sort((a, b) => b.quando - a.quando);

      $('res-total-recarga').textContent = fmtBRL(totalRecarga);
      $('res-total-gasto').textContent = fmtBRL(totalGasto);

      const tbody = $('tbl-mov');
      tbody.innerHTML = '';
      if (movimentos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state">${icon('inbox', { size: 32 })}<p>Sem movimentações.</p></div></td></tr>`;
      } else {
        movimentos.forEach(m => {
          const corValor = m.positivo ? 'var(--verde)' : 'var(--vermelho)';
          const sinal = m.positivo ? '+' : '-';
          const clicavel = m.vendaId ? `data-venda-id="${m.vendaId}" style="cursor:pointer;"` : '';
          const dica = m.vendaId ? ' title="Ver detalhes"' : '';
          tbody.innerHTML += `
            <tr ${clicavel}${dica}>
              <td>${m.quando.toLocaleString('pt-BR')}</td>
              <td><span style="background:${m.cor};color:white;padding:2px 8px;border-radius:999px;font-size:0.8rem;">${m.tipo}</span></td>
              <td style="font-size:0.875rem;">${m.detalhe}</td>
              <td style="font-weight:700;color:${corValor};">${sinal} ${fmtBRL(m.valor)}</td>
            </tr>
          `;
        });
      }
      // Listener delegado: clicar numa linha de venda abre detalhes
      tbody.onclick = (e) => {
        const tr = e.target.closest('tr[data-venda-id]');
        if (!tr) return;
        const v = vendasPorId.get(tr.dataset.vendaId);
        if (v) abrirDetalheVenda(v);
      };

      $('resultado').classList.remove('hidden');
      } finally {
        $('btn-buscar').disabled = false;
      }
    }

    function abrirDetalheVenda(v) {
      const quando = v.criadoEm?.toDate?.()?.toLocaleString('pt-BR') || '—';
      const itensHtml = (v.itens || []).map(i => `
        <div class="item">
          <div><span class="qtd">${i.qtd}×</span>${i.nome}</div>
          <div>${fmtBRL(i.subtotal ?? (i.qtd * i.preco))}</div>
        </div>
      `).join('');
      const corpo = `
        <div class="meta">
          ${quando}
          ${v.eventoNome ? ` · <strong>${v.eventoNome}</strong>` : ''}
          ${v.operadorNome ? ` · operador: ${v.operadorNome}` : ''}
        </div>
        <div style="font-size:0.85rem;color:var(--cinza);">Cliente</div>
        <div style="font-weight:600;margin-bottom:0.5rem;">${v.clienteNome || ''} <span style="color:var(--cinza);font-weight:400;">(${v.clienteId})</span></div>
        <div class="itens">
          ${itensHtml || '<p class="text-muted" style="padding:0.5rem 0;">Sem itens registrados.</p>'}
        </div>
        <div class="total">
          <span>Total</span>
          <span>${fmtBRL(v.total)}</span>
        </div>
      `;
      abrirDetalhe({ titulo: `${icon('shopping-cart', { size: 20 })} Venda`, corpo });
    }

    carregarEventos();
    carregarClientes();
  </script>
</body>
</html>

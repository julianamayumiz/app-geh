<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compras — Admin GEH</title>
  <script>(function(){try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</head>
<body>
  <main class="admin">
    <h2 style="color:var(--azul);margin-bottom:1rem;display:inline-flex;align-items:center;gap:0.5rem;"><span data-icon="shopping-bag" data-size="24"></span> Compras / Entrada de estoque</h2>
    <p class="text-muted mb-2">Registre aqui a compra de produtos para o evento. O estoque é atualizado automaticamente.</p>

    <div class="card">
      <h3 class="card-title">Nova entrada</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;">
        <div class="form-group">
          <label>Produto</label>
          <select id="compra-produto"><option value="">Selecione...</option></select>
        </div>
        <div class="form-group">
          <label>Quantidade</label>
          <input type="number" id="compra-qtd" min="1" step="1">
        </div>
        <div class="form-group">
          <label>Custo total (R$)</label>
          <input type="number" id="compra-custo" step="0.01" min="0">
        </div>
        <div class="form-group">
          <label>Fornecedor</label>
          <input type="text" id="compra-fornecedor" placeholder="Opcional">
        </div>
      </div>
      <div id="alerta" class="alert hidden"></div>
      <button id="btn-registrar" class="btn btn-primary">Registrar compra</button>
    </div>

    <h3 style="color:var(--azul);margin:1.5rem 0 0.75rem;">Histórico</h3>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr><th>Data</th><th>Produto</th><th>Qtd</th><th>Custo</th><th>Fornecedor</th></tr>
        </thead>
        <tbody id="tbl"><tr><td colspan="5" class="text-center text-muted">Carregando...</td></tr></tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { montarNav, fmtBRL } from "./_nav.js";
    import {
      db, collection, doc, getDoc, addDoc, updateDoc, onSnapshot,
      query, orderBy, limit, serverTimestamp, runTransaction
    } from "../js/firebase-config.js";
    import { icon, renderIcons } from "../js/icons.js";

    montarNav('compras.html');
    renderIcons();

    const $ = (id) => document.getElementById(id);
    const alerta = $('alerta');

    onSnapshot(collection(db, 'produtos'), (snap) => {
      const sel = $('compra-produto');
      const valorAtual = sel.value;
      sel.innerHTML = '<option value="">Selecione...</option>';
      snap.forEach(d => {
        const p = d.data();
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = `${p.nome} (estoque: ${p.estoque})`;
        sel.appendChild(opt);
      });
      sel.value = valorAtual;
    });

    $('btn-registrar').onclick = async () => {
      const produtoId = $('compra-produto').value;
      const qtd = parseInt($('compra-qtd').value);
      const custo = parseFloat($('compra-custo').value) || 0;
      const fornecedor = $('compra-fornecedor').value.trim();

      if (!produtoId || !qtd || qtd <= 0) {
        alerta.textContent = 'Selecione produto e quantidade válida.';
        alerta.className = 'alert alert-warning';
        return;
      }

      try {
        await runTransaction(db, async (tx) => {
          const prodRef = doc(db, 'produtos', produtoId);
          const prodSnap = await tx.get(prodRef);
          if (!prodSnap.exists()) throw new Error('Produto não existe');
          const p = prodSnap.data();
          tx.update(prodRef, { estoque: (p.estoque || 0) + qtd });

          const compraRef = doc(collection(db, 'compras'));
          tx.set(compraRef, {
            produtoId,
            produtoNome: p.nome,
            qtd,
            custoTotal: custo,
            fornecedor,
            criadoEm: serverTimestamp()
          });
        });

        $('compra-qtd').value = '';
        $('compra-custo').value = '';
        $('compra-fornecedor').value = '';
        alerta.innerHTML = `<span style="display:inline-flex;align-items:center;gap:0.4rem;">${icon('check-circle', { size: 16 })} Compra registrada e estoque atualizado.</span>`;
        alerta.className = 'alert alert-success';
        setTimeout(() => alerta.classList.add('hidden'), 2000);
      } catch (err) {
        alerta.textContent = `Erro: ${err.message}`;
        alerta.className = 'alert alert-danger';
      }
    };

    onSnapshot(query(collection(db, 'compras'), orderBy('criadoEm', 'desc'), limit(100)), (snap) => {
      const tbody = $('tbl');
      tbody.innerHTML = '';
      if (snap.empty) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Sem compras registradas.</td></tr>';
        return;
      }
      snap.forEach(d => {
        const c = d.data();
        const quando = c.criadoEm?.toDate?.()?.toLocaleString('pt-BR') || '—';
        tbody.innerHTML += `
          <tr>
            <td>${quando}</td>
            <td>${c.produtoNome}</td>
            <td>${c.qtd}</td>
            <td>${fmtBRL(c.custoTotal)}</td>
            <td>${c.fornecedor || '—'}</td>
          </tr>
        `;
      });
    });
  </script>
</body>
</html>

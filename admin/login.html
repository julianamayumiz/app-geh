<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F1D4D">
  <meta name="theme-color" content="#0A1436" media="(prefers-color-scheme: dark)">
  <title>Login Admin — App GEH</title>
  <script>(function(){try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
  <style>
    .login-card {
      background: var(--branco);
      color: var(--cinza-escuro);
      padding: 1.75rem 1.5rem;
      border-radius: 16px;
      box-shadow: 0 24px 60px -20px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.06) inset;
      border: 1px solid rgba(15,29,77,0.08);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .login-card .form-group { margin-bottom: 0; }
    .login-card .btn { width: 100%; }
    .login-divider {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--cinza);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      margin: 0.25rem 0;
    }
    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--cinza-claro);
    }
    .login-link {
      background: none;
      border: none;
      color: var(--azul);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0.25rem;
      align-self: center;
    }
    .login-voltar {
      margin-top: 0.5rem;
      align-self: center;
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .login-voltar:hover { color: white; }
  </style>
</head>
<body>
  <div class="landing login">
    <span class="tag warn"><span class="dot"></span> Acesso restrito</span>

    <div class="logo-wrap">
      <img src="../assets/logo.png" alt="GEH" onerror="this.style.display='none'">
    </div>

    <h1>Diretoria de Eventos</h1>
    <p>Entre com seu e-mail institucional ou conta Google.</p>

    <div class="acoes">
      <div class="login-card">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="email" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="senha" autocomplete="current-password">
        </div>
        <div id="alerta" class="alert alert-danger hidden"></div>
        <div id="alerta-ok" class="alert alert-success hidden"></div>
        <button id="btn-login" class="btn btn-primary">Entrar</button>
        <button id="btn-esqueci" type="button" class="login-link">Esqueci minha senha</button>

        <div class="login-divider"><span>ou</span></div>

        <button id="btn-google" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 5.8 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
            <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 5.8 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.4-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2c-.4.4 6.6-4.8 6.6-14.8 0-1.3-.1-2.6-.4-3.9z"/>
          </svg>
          Entrar com Google
        </button>
      </div>

      <a href="../index.html" class="login-voltar"><span data-icon="arrow-left" data-size="16"></span> Voltar à tela inicial</a>
    </div>
  </div>
  <script type="module" src="../js/icons.js"></script>

  <script type="module">
    import {
      auth, signInWithEmailAndPassword, onAuthStateChanged,
      GoogleAuthProvider, signInWithPopup, signOut, sendPasswordResetEmail
    } from "../js/firebase-config.js";
    import { carregarPerfil } from "../js/auth-guard.js";
    import { icon } from "../js/icons.js";

    const alerta = document.getElementById('alerta');
    const alertaOk = document.getElementById('alerta-ok');

    const params = new URLSearchParams(location.search);
    if (params.get('erro') === 'sem-acesso') {
      alerta.textContent = 'Sua conta não tem acesso. Fale com a diretoria para ser cadastrada.';
      alerta.classList.remove('hidden');
    }

    function destinoPor(perfil) {
      if (perfil?.papel === 'operador') return '../operador/index.html';
      if (perfil?.papel === 'caixa')    return '../caixa/index.html';
      if (perfil?.papel === 'recepcao') return '../recepcao/index.html';
      return 'dashboard.html';
    }

    async function dispatch(user) {
      const perfil = await carregarPerfil(user);
      if (!perfil || perfil.ativo === false) {
        await signOut(auth);
        alerta.textContent = perfil?.ativo === false
          ? 'Sua conta foi desativada. Fale com a diretoria.'
          : 'Sua conta ainda não tem acesso. Fale com a diretoria para ser cadastrada.';
        alerta.classList.remove('hidden');
        return;
      }
      window.location.href = destinoPor(perfil);
    }

    onAuthStateChanged(auth, (user) => {
      if (user) dispatch(user);
    });

    document.getElementById('btn-login').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      alerta.classList.add('hidden');
      try {
        const cred = await signInWithEmailAndPassword(auth, email, senha);
        await dispatch(cred.user);
      } catch (err) {
        alerta.textContent = 'E-mail ou senha inválidos.';
        alerta.classList.remove('hidden');
      }
    };

    document.getElementById('btn-esqueci').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      alerta.classList.add('hidden');
      alertaOk.classList.add('hidden');
      if (!email) {
        alerta.textContent = 'Digite seu e-mail acima antes de clicar.';
        alerta.classList.remove('hidden');
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        alertaOk.innerHTML = `<span style="display:inline-flex;align-items:center;gap:0.4rem;">${icon('check-circle', { size: 18 })} Link de redefinição enviado para ${email}. Confira sua caixa de entrada.</span>`;
        alertaOk.classList.remove('hidden');
      } catch (err) {
        alerta.textContent = `Erro: ${err.message}`;
        alerta.classList.remove('hidden');
      }
    };

    document.getElementById('btn-google').onclick = async () => {
      alerta.classList.add('hidden');
      try {
        const provider = new GoogleAuthProvider();
        const cred = await signInWithPopup(auth, provider);
        await dispatch(cred.user);
      } catch (err) {
        alerta.textContent = `Erro no login Google: ${err.message}`;
        alerta.classList.remove('hidden');
      }
    };
  </script>
</body>
</html>
